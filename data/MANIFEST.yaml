  checkpoints:
    description: |
      The two trained models: last-v95.ckpt (fiducial, every main-text figure) and
      last-v97.ckpt (Appendix D no-theta ablation). With these plus maps you can
      regenerate every prediction; without them you need a GPU-day per model to retrain.
