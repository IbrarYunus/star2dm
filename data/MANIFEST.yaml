  cache:
    description: |
      Reduced figure data: the (n_galaxies, 32) arrays the panels are actually drawn from,
      plus full draws for the few galaxies whose figures show individual draws. Enough to
      redraw all 43 figures pixel for pixel, with maps, and nothing else.
      Built by scripts/pack_figure_cache.py; fill in bytes and sha256 at publish time.
    files:
      - root: cache
        path: "stars2dm-figure-cache.tar.gz"
        url: "cache/stars2dm-figure-cache.tar.gz"
        bytes: 0
        sha256: "REPLACE-ME-run-pack_figure_cache.py"

  predictions:
    description: |
      The raw prediction draws, ~23 GB. Only needed to change something the cache fixes:
      the annulus geometry, the histogram binning, or how draws are combined. Everything
      else is answered by the cache tier at a thousandth of the size.
      Per-galaxy npz for v95 and v97 over DREAMS, TNG50 and FIRE m12, plus the five
      parameter sweeps whole -- all five grid points, not just the two Appendix C plots.
      Trimming them would break the published --draws-slice 40:50 commands and would
      remove exactly what someone fetching this tier is likely to want.
      Fill in bytes and sha256 at publish time.
    files:
      - root: pred
        path: "stars2dm-predictions.tar"
        url: "predictions/stars2dm-predictions.tar"
        bytes: 0
        sha256: "REPLACE-ME-pack-the-prediction-tree"
