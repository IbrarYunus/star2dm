# Where the data that is not in this repository lives, and what it should hash to.
#
# ONE LINE TO EDIT BEFORE PUBLISHING: archive_base_url. Everything else is already correct
# -- the checksums are of the actual files the paper used and do not depend on where they
# are hosted. scripts/fetch_data.py refuses to download while the placeholder is in place
# and says which line to change.
#
# Paths are relative to a STARS2DM_* root (see src/stars2dm_paths.py):
#   dreams -> $STARS2DM_DREAMS_ROOT     pred        -> $STARS2DM_PRED_ROOT
#   tng    -> $STARS2DM_TNG_ROOT        checkpoints -> $STARS2DM_CKPT_ROOT
#   fire   -> $STARS2DM_FIRE_ROOT       cache       -> $STARS2DM_CACHE_ROOT
#
# So the layout on the archive is yours to choose; only `url` has to match it.

archive_base_url: "https://REPLACE-ME.invalid/stars2dm/v1"

tiers:

  maps:
    description: |
      Paired stellar and dark-matter density maps, plus the simulation-parameter tables.
      The training input for both models and the truth for every figure. Needed by every
      tier below -- nothing works without this one.
      DREAMS 1024 galaxies, TNG50 264, FIRE m12 8; all 128x128 on the z=0.35 grid.
